spring:
  application:
    name: observatorio-zaragoza
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el único dueño del esquema; Hibernate solo comprueba que las entidades casan (ADR-004).
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      jdbc:
        schema-initialization:
          # La tabla event_publication la crea V002__event_publication.sql (ADR-004).
          enabled: false
      # Una sola instancia: al reiniciar se reintentan las publicaciones incompletas (ADR-004).
      republish-outstanding-events-on-restart: true
  task:
    scheduling:
      pool:
        # Los jobs de ingesta se ejecutan en serie; sustituye a ShedLock mientras haya una sola instancia (ADR-004).
        size: 1
  http:
    clients:
      # Reglas de S0.5: timeouts de lectura >= 30 s (hay endpoints de 11 s) y nunca seguir redirecciones
      # (la URL sin extensión redirige a HTML; usamos siempre .json).
      connect-timeout: 30s
      read-timeout: 60s
      redirects: dont-follow

  mvc:
    problemdetails:
      # Errores de la API propia como application/problem+json (RFC 9457).
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

zaragoza:
  # Identificación del reutilizador en toda petición saliente (SPEC.md §2.2); la aplica HttpClientConfiguration.
  http:
    user-agent: "observatorio-zaragoza/0.0.1 (+https://github.com/MarioNaya/zaragoza-observatorio)"
  # Módulo ingestion (SPEC.md §4.5, docs/spikes/S0.5-api.md, ADR-004). Valores por defecto explícitos.
  ingestion:
    http:
      max-concurrent-requests: 4
    retry:
      max-attempts: 3
      initial-backoff: PT1S
      multiplier: 2.0
    circuit-breaker:
      sliding-window-size: 6
      minimum-calls: 3
      failure-rate-threshold: 50
      wait-in-open-state: PT2M
    # Cortesía entre páginas (1-2 req/s, S0.5) y tope de páginas por ejecución.
    page-delay: PT0.5S
    max-pages: 1000
    # Retención de raw_payload (SPEC.md §9, provisional).
    raw-retention: P14D
    scheduler:
      enabled: true
      tick: PT10M
      initial-delay: PT30S
      raw-purge-cron: "0 30 4 * * *"
  # Módulo catalog (S0.1; fl con formato verificado el 2026-09-06). Umbrales de frescura: SPEC.md §4.6/§9.
  catalog:
    catalog-url: https://www.zaragoza.es/web/espacio-de-datos/servicio/catalogo.json
    fields: id,title,description_basic,issued,modified,lastUpdated,accrualPeriodicity,status,geo,abierto,explorable,formato
    interval: PT6H
    freshness:
      on-time-max: 1.0
      slight-delay-max: 2.0
      delayed-max: 5.0
    # Eje observado (docs/spikes/S1.1-frescura-observada.md): cada ficha se observa una vez al día, por lotes,
    # con la primera distribución que responde (API rows=1 + sort desc, HEAD a ficheros, WFS hits).
    observation:
      enabled: true
      interval: P1D
      tick: PT10M
      initial-delay: PT2M
      batch-size: 60
      request-delay: PT0.5S
      max-file-distributions: 10
    # Inventario de endpoints (docs/spikes/S1.2-inventario-api.md): el Swagger 2.0 de la API como documento único,
    # sin parámetros de paginación (la fuente los ignora y no publica Last-Modified ni ETag); una vez al día.
    api-inventory:
      url: https://www.zaragoza.es/sede/servicio/catalogo/api.json
      interval: P1D

---
# Perfil prod: logs estructurados JSON (SPEC.md §4.2 Observabilidad).
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
